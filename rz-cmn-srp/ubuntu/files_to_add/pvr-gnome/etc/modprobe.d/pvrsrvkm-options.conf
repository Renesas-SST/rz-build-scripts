# Module parameters for the PowerVR GPU driver (pvrsrvkm).
#
# The module is autoloaded at boot via /usr/lib/modules-load.d/pvrsrvkm.conf
# (shipped by the kernel package) with default parameters, which is correct
# for normal desktop use. This file is the Ubuntu equivalent of the knobs the
# Yocto rc.pvr init script computes at boot — uncomment and edit only if a
# Renesas release note asks for specific parameters.
#
# DriverMode: 0x7fffffff = default/native (same as leaving it unset).
#             Other values select host/guest virtualization or safety modes —
#             see the Renesas rcar-gfx documentation for your DDK release.
#
#options pvrsrvkm DriverMode=0x7fffffff
#
# Note: runtime app-hints (e.g. EnableAPM, the GPU active power management
# toggle rc.pvr pokes after load) are NOT module parameters; set those via
# debugfs after boot instead:
#   echo 1 > /sys/kernel/debug/pvr/gpu00/apphint/EnableAPM
