# The loopback interface
auto lo
iface lo inet loopback

# Wireless interfaces
iface wlan0 inet dhcp
	wireless_mode managed
	wireless_essid any
	wpa-driver wext
	wpa-conf /etc/wpa_supplicant.conf

# Wired or wireless interfaces
allow-hotplug end0
allow-hotplug end1
iface end0 inet dhcp
iface end1 inet dhcp
